<script>
  const iframe = document.getElementById('lineplotFrame');
  iframe.addEventListener('load', () => {
    try {
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframe.style.height = iframeDoc.body.scrollHeight +10 + 'px';
      iframe.style.width = iframeDoc.body.scrollWidth+10 + 'px';
    } catch (error) {
      console.error('Error adjusting iframe dimensions:', error);
    }
  });
</script>
